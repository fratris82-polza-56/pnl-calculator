services:
  plan-zvezda:
    image: node:24-alpine
    container_name: plan-zvezda
    restart: unless-stopped
    working_dir: /app
    environment:
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - ./:/app
    command: ["node", "server.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
