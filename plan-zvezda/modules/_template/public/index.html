<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой модуль — План-Звезда</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#133367;--mut:#7d8894;--line:#e0e7ef;--acc:#4169aa;}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(23,33,43,.04)}
h2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.tip{background:#e2f3e5;border:1px solid #bfe2c6;border-radius:12px;padding:11px 12px;font-size:14px;color:#2c5e3f}
.tip::before{content:'💡 ';}
</style>
</head>
<body>
<div class="wrap">
<div class="card" style="margin-top:12vh;text-align:center">
  <h2 style="text-transform:none;font-size:20px;color:var(--ink);margin-bottom:8px">📦 Мой модуль</h2>
  <p style="color:var(--mut);margin-bottom:16px">Код модуля: <b id="mid">—</b></p>
  <div class="tip">Это шаблон модуля. Скопируй <code>modules/_template/</code> в новую папку и замени код.</div>
</div>
</div>
<script>
const TOKEN=localStorage.getItem('me_token')||'';
if(!TOKEN) location.href='/me.html';
const match=location.pathname.match(/^\/m\/([^/]+)\//);
document.getElementById('mid').textContent=match?match[1]:'неизвестен';
</script>
</body>
</html>
